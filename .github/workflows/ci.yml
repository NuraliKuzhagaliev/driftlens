name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Tests & release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Unit & integration tests ──────────────────────────────────────────
      - name: npm test
        run: npm test

      # ── DriftLens gate — broken demo fixtures (must stay broken) ─────────
      # The intentionally broken checkout fixtures always hold release.
      # We expect exit code 2 and treat anything else as a failure.
      - name: DriftLens gate — broken fixtures (expect HOLD)
        run: |
          gate_exit=0
          node bin/ci-gate.js \
            --source     fixtures/app.py \
            --example    fixtures/.env.example \
            --deployment fixtures/compose.yaml \
            --contract   fixtures/contract.json || gate_exit=$?
          if [ "$gate_exit" -ne 2 ]; then
            echo "::error title=DriftLens broken-fixtures::Expected exit 2 (HOLD), got $gate_exit."
            exit 1
          fi

      # ── DriftLens gate — healthy fixtures (must stay green) ───────────────
      # The healthy notifications-api fixtures must pass.  Any drift here
      # (e.g. a required key removed from contract.json) fails the pipeline.
      - name: DriftLens gate — healthy fixtures (expect READY)
        run: |
          node bin/ci-gate.js \
            --source     fixtures/healthy/app.py \
            --example    fixtures/healthy/.env.example \
            --deployment fixtures/healthy/compose.yaml \
            --contract   fixtures/healthy/contract.json

      # ── Upload JSON report as artefact ────────────────────────────────────
      - name: Generate JSON report (healthy fixtures)
        if: always()
        run: |
          node bin/ci-gate.js \
            --source     fixtures/healthy/app.py \
            --example    fixtures/healthy/.env.example \
            --deployment fixtures/healthy/compose.yaml \
            --contract   fixtures/healthy/contract.json \
            --json > driftlens-report.json || true

      - name: Upload DriftLens report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftlens-report
          path: driftlens-report.json
